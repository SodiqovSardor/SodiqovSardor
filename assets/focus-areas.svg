<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">What I Build — focus areas</title>
  <desc id="desc">Three focus areas: frontend craft, systems tools, and developer experience.</desc>
  <rect width="1200" height="360" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="68" rx="18" fill="#161b22"/>
  <path d="M0 68H1200" stroke="#30363d" stroke-width="2"/>
  <text x="36" y="43" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700">Area</text>
  <text x="330" y="43" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700">Focus</text>
  <path d="M294 0V360" stroke="#30363d" stroke-width="2"/>
  <path d="M0 164H1200M0 260H1200" stroke="#30363d" stroke-width="2"/>
  <text x="36" y="125" fill="#79c0ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">Frontend craft</text>
  <text x="330" y="116" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">React interfaces, responsive layouts,</text>
  <text x="330" y="146" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">component systems, and polished details.</text>
  <text x="36" y="221" fill="#79c0ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">Systems tools</text>
  <text x="330" y="212" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Small terminal-first utilities with clear</text>
  <text x="330" y="242" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">behavior and low overhead.</text>
  <text x="36" y="317" fill="#79c0ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">Developer experience</text>
  <text x="330" y="308" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Safer workflows, useful demos, better</text>
  <text x="330" y="338" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">structure, and practical documentation.</text>
</svg>
