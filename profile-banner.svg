<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sardor Sodiqov — frontend developer and systems tinkerer</title>
  <desc id="desc">A midnight-blue developer profile banner with electric blue and cyan geometric accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D1B"/>
      <stop offset="0.55" stop-color="#111B35"/>
      <stop offset="1" stop-color="#07101D"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="85" x2="1070" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 70) rotate(136) scale(300 260)">
      <stop stop-color="#2563EB" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9DB9E8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>

  <path d="M0 252C190 198 302 290 506 230C680 178 780 98 1200 140" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M0 274C202 218 324 306 520 252C714 198 858 122 1200 170" stroke="url(#accent)" stroke-opacity="0.1" stroke-width="2"/>

  <g opacity="0.9" filter="url(#shadow)">
    <rect x="820" y="48" width="290" height="224" rx="20" fill="#0B1224" fill-opacity="0.78" stroke="#70A7FF" stroke-opacity="0.22"/>
    <path d="M854 90H1076" stroke="#70A7FF" stroke-opacity="0.25"/>
    <circle cx="854" cy="70" r="5" fill="#F87171"/>
    <circle cx="872" cy="70" r="5" fill="#FBBF24"/>
    <circle cx="890" cy="70" r="5" fill="#34D399"/>
    <text x="856" y="124" fill="#7DD3FC" font-family="monospace" font-size="16">$ whoami</text>
    <text x="856" y="151" fill="#E0F2FE" font-family="monospace" font-size="18">sardor@github</text>
    <text x="856" y="188" fill="#93C5FD" font-family="monospace" font-size="15">ship small.</text>
    <text x="856" y="212" fill="#A5B4FC" font-family="monospace" font-size="15">think deeply.</text>
    <text x="856" y="236" fill="#67E8F9" font-family="monospace" font-size="15">build clearly.</text>
  </g>

  <g>
    <text x="86" y="112" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">SARDOR SODIQOV</text>
    <text x="82" y="168" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800">Frontend developer</text>
    <text x="84" y="215" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="23">&amp; systems tinkerer</text>
    <rect x="86" y="246" width="76" height="4" rx="2" fill="url(#accent)"/>
    <rect x="174" y="246" width="28" height="4" rx="2" fill="#334155"/>
    <rect x="214" y="246" width="14" height="4" rx="2" fill="#334155"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="23" stroke="#8DB8FF" stroke-opacity="0.18" stroke-width="2"/>
</svg>
